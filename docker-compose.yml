services:
  postgres:
    image: postgres:16-alpine
    container_name: workbuddy-postgres
    environment:
      POSTGRES_USER: workbuddy
      POSTGRES_PASSWORD: workbuddy
      POSTGRES_DB: workbuddy
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workbuddy -d workbuddy"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: workbuddy-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workbuddy-app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://workbuddy:workbuddy@postgres:5432/workbuddy?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - app

volumes:
  postgres_data:
  redis_data:
