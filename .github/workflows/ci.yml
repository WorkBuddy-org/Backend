name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workbuddy
          POSTGRES_PASSWORD: workbuddy
          POSTGRES_DB: workbuddy
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U workbuddy -d workbuddy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://workbuddy:workbuddy@127.0.0.1:5433/workbuddy?sslmode=disable
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET: ci-test-secret
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 720h
      ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.14"
          cache: true

      - name: Install goose migration tool dependencies
        run: go mod download

      - name: Run migrations
        run: go run ./cmd/migrate up

      - name: Go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: govulncheck
        continue-on-error: true
        run: govulncheck ./...

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0

      - name: gosec
        continue-on-error: true
        run: gosec ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...
